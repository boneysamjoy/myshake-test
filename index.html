<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyShake — Web Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      background: #0D1A16;
      overflow-x: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      background: #0D1A16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }

    .loader-logo {
      width: 160px;
      height: auto;
      opacity: 0;
      animation: fadelogo 0.6s ease 0.2s forwards;
    }
    @keyframes fadelogo { to { opacity: 1; } }

    .loader-bar-track {
      width: 160px; height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px; overflow: hidden;
    }
    .loader-bar-fill {
      height: 100%; width: 0%;
      background: #B8F55A;
      animation: loadfill 1.2s ease forwards;
    }
    @keyframes loadfill { to { width: 100%; } }

    img {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    img.visible { opacity: 1; }

    #footer {
      text-align: center;
      padding: 16px;
      font-family: Calibri, sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="loader">
    <img class="loader-logo" src="https://raw.githubusercontent.com/boneysamjoy/myshake-test/main/Logo1.png" alt="MyShake" />
    <div class="loader-bar-track"><div class="loader-bar-fill"></div></div>
  </div>

  <img
    id="img"
    src="https://raw.githubusercontent.com/boneysamjoy/myshake-test/main/Myshake%20webpre.png"
    alt="MyShake Website Design Preview"
  />

  <div id="footer">MyShake · Live to Perform · Design Preview</div>

  <script>
    const img = document.getElementById('img');
    const loader = document.getElementById('loader');
    function reveal() {
      setTimeout(() => {
        loader.classList.add('hidden');
        img.classList.add('visible');
      }, 1400);
    }
    img.complete ? reveal() : img.addEventListener('load', reveal);
    img.addEventListener('error', reveal);
  </script>

</body>
</html>
